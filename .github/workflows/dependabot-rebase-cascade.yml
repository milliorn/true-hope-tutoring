name: Dependabot stale rebase

# Fires when a Dependabot PR is actually merged into main. This used to
# trigger on workflow_run of "Dependabot reviewer", but that workflow only
# *queues* auto-merge (gh pr merge --auto) and finishes before the merge
# lands, so this job ran while siblings were still up to date and every
# "@dependabot rebase" was a no-op. pull_request_target is used (not
# pull_request) so secrets are available; no PR code is checked out.
# The merge is PAT-authenticated (see automerge.yml), so this event fires.
on:
  pull_request_target:
    types: [closed]
    branches: ["main"]

permissions:
  pull-requests: write

jobs:
  rebase-stale-dependabot-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    env:
      # Dependabot only honors @dependabot commands from a commenter with
      # push access. A GITHUB_TOKEN-authored comment (github-actions[bot])
      # is silently rejected ("only users with push access"), which used to
      # make this job re-comment on every PR on every run forever without
      # ever actually rebasing anything. DEPENDABOT_REBASE_PAT must be a PAT
      # (classic or fine-grained with pull-requests:write) or GitHub App
      # installation token belonging to an account with push access.
      GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_PAT }}
      REPO: ${{ github.repository }}

    steps:
      - name: Rebase stale/diverged open Dependabot PRs
        run: |
          # Only BEHIND (out of date with main) and DIRTY (conflicts) are
          # fixed by a rebase. BLOCKED usually just means checks are still
          # running, so rebasing it only restarts them.
          # Right after a merge GitHub recomputes sibling merge states
          # lazily and reports UNKNOWN, so retry until they settle.
          for attempt in 1 2 3 4 5 6; do
            states=$(gh pr list --repo "$REPO" --author "app/dependabot" \
              --state open --json number,mergeStateStatus)
            if ! jq -e 'any(.[]; .mergeStateStatus == "UNKNOWN")' <<<"$states" >/dev/null; then
              break
            fi
            echo "Merge states still UNKNOWN (attempt $attempt), waiting..."
            sleep 10
          done

          jq -r '.[] | select(.mergeStateStatus == "BEHIND" or .mergeStateStatus == "DIRTY") | .number' <<<"$states" |
            xargs -r -P 8 -I{} gh pr comment {} --repo "$REPO" --body "@dependabot rebase"

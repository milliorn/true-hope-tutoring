# Source repository: https://github.com/BobAnkh/auto-generate-changelog
# Public documentation: https://github.com/marketplace/actions/auto-generate-changelog
#
# Fires on `published` and regenerates CHANGELOG.md from Conventional Commit
# history (feat/fix/etc.) since the last release covered in the file.
# `released` was tried too (meant to catch a prerelease later promoted to a
# full release) and reverted: GitHub's own docs describe it as firing for a
# release being published OR a prerelease being converted, i.e. it overlaps
# with `published` for ordinary releases rather than being promotion-only,
# which would have opened two competing changelog PRs per normal release.
# A prerelease promoted to a full release later is a known, accepted gap --
# re-publish or manually re-run this workflow to cover it. No checkout step:
# the generator does everything -- reading commits/tags and reading/writing
# CHANGELOG.md -- via the GitHub API (repo.get_contents/update_file/
# create_file), never touching a local workspace.
#
# main is protected by a ruleset requiring PRs, and GITHUB_TOKEN has no
# bypass entry on it, so a direct push would be rejected. The generator
# instead opens a PR (BRANCH -> PULL_REQUEST inputs below) for a human to
# review and merge, the same way every other change lands on main. This
# differs from the action's own reference usage (its own repo's workflows
# push straight to a long-lived branch, no PR) only because of main's
# ruleset; the fixed branch name below otherwise matches that reference
# pattern -- every run reuses the same branch, updating any already-open
# changelog PR in place rather than spawning a new one, so there's no
# multi-branch/multi-PR class of problem to guard against.
#
# ACCESS_TOKEN must be a PAT (CHANGELOG_PAT), not GITHUB_TOKEN: GitHub Actions
# does not fire pull_request-triggered workflows (ci.yml, merge-gatekeeper.yml)
# for PRs authored by GITHUB_TOKEN, so the PR would never satisfy the
# required merge-gatekeeper status check and would be stuck unmergeable. A
# PAT-authored PR triggers those workflows normally.
#
# The branch is prefixed docs/ (the Conventional Commits type of the commit
# this PR makes, docs(changelog): ...) per this repo's branch naming
# convention.
#
# Concurrency still serializes runs (not to avoid competing branches/PRs --
# the fixed branch already rules that out -- but because the action reads
# CHANGELOG.md then writes it back, and two runs racing on that read/write
# against the same branch could clobber each other's changes).
name: Changelog

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  update-changelog:
    # Pre-releases (RCs, betas) aren't final -- don't document them in
    # CHANGELOG.md, which is scoped to real releases.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # 5 min, not 3: the action is a Docker action built from its own
    # Dockerfile (no prebuilt image), so every run pays a cold apt/pip
    # build on top of the changelog generation itself.
    timeout-minutes: 5
    steps:
      - name: Update CHANGELOG.md
        uses: BobAnkh/auto-generate-changelog@e8e1af1493032e025901cfdeb9ea6e67e4ffe208 # v1.3.2
        with:
          REPO_NAME: ${{ github.repository }}
          ACCESS_TOKEN: ${{ secrets.CHANGELOG_PAT }}
          PATH: "CHANGELOG.md"
          BRANCH: "docs/changelog-update"
          PULL_REQUEST: "main"
          COMMIT_MESSAGE: "docs(changelog): update release notes"
          TYPE: "feat:Features,fix:Bug Fixes,docs:Documentation,refactor:Refactor,perf:Performance Improvements,chore:Chores,ci:CI,test:Tests,style:Styles"

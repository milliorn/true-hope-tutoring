# Source repository: https://github.com/BobAnkh/auto-generate-changelog
# Public documentation: https://github.com/marketplace/actions/auto-generate-changelog
#
# Regenerates CHANGELOG.md from Conventional Commit history on every real
# release. Only listens for `published`, not `released`: GitHub's own docs
# describe `released` as firing for a release being published OR a
# prerelease being converted, i.e. it overlaps with `published` rather than
# being promotion-only, so listening for both would open two competing
# changelog PRs per normal release. That leaves prerelease-promoted-to-full
# as a known, accepted gap -- there's no workflow_dispatch trigger to invoke
# this on demand, and GitHub's "Re-run jobs" only replays a run that already
# happened, so the only recovery is to unpublish and republish the release
# so `published` fires for real. Pre-releases themselves are filtered by the
# job's `if:` guard below, since they aren't final enough for CHANGELOG.md.
#
# main's branch ruleset requires PRs with no bypass for GITHUB_TOKEN, so the
# generator opens a PR (BRANCH -> PULL_REQUEST) instead of pushing directly.
# ACCESS_TOKEN is a PAT (CHANGELOG_PAT), not GITHUB_TOKEN, because GitHub
# Actions doesn't fire pull_request-triggered workflows (ci.yml,
# merge-gatekeeper.yml) for PRs authored by GITHUB_TOKEN -- that PR would
# never satisfy the required merge-gatekeeper check and would be stuck
# unmergeable. BRANCH is fixed (not per-release) so every run updates the
# same branch/PR in place instead of spawning a new one each release,
# matching the action's own non-PR reference usage of a long-lived branch.
# Concurrency still serializes runs for a different reason: the action reads
# CHANGELOG.md then writes it back, and two runs racing that read/write on
# the same branch could clobber each other's changes.
name: Changelog

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  update-changelog:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # 5 min, not 3: the action is a Docker action built from its own
    # Dockerfile (no prebuilt image), so every run pays a cold apt/pip
    # build on top of the changelog generation itself.
    timeout-minutes: 5
    steps:
      - name: Update CHANGELOG.md
        uses: BobAnkh/auto-generate-changelog@e8e1af1493032e025901cfdeb9ea6e67e4ffe208 # v1.3.2
        with:
          REPO_NAME: ${{ github.repository }}
          ACCESS_TOKEN: ${{ secrets.CHANGELOG_PAT }}
          PATH: "CHANGELOG.md"
          BRANCH: "docs/changelog-update"
          PULL_REQUEST: "main"
          COMMIT_MESSAGE: "docs(changelog): update release notes"
          TYPE: "feat:Features,fix:Bug Fixes,docs:Documentation,refactor:Refactor,perf:Performance Improvements,chore:Chores,ci:CI,test:Tests,style:Styles"

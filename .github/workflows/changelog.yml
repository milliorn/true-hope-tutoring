# Source repository: https://github.com/BobAnkh/auto-generate-changelog
# Public documentation: https://github.com/marketplace/actions/auto-generate-changelog
#
# Fires when a GitHub Release is published and regenerates CHANGELOG.md from
# Conventional Commit history (feat/fix/etc.) since the last release covered
# in the file. fetch-depth: 0 is required -- the generator needs full commit
# history, not just the tip, to walk prior tags/releases.
#
# main is protected by a ruleset requiring PRs, and GITHUB_TOKEN has no
# bypass entry on it, so a direct push would be rejected. The generator
# instead opens a PR (BRANCH -> PULL_REQUEST inputs below) for a human to
# review and merge, the same way every other change lands on main.
#
# ACCESS_TOKEN must be a PAT (CHANGELOG_PAT), not GITHUB_TOKEN: GitHub Actions
# does not fire pull_request-triggered workflows (ci.yml, merge-gatekeeper.yml)
# for PRs authored by GITHUB_TOKEN, so the PR would never satisfy the
# required merge-gatekeeper status check and would be stuck unmergeable. A
# PAT-authored PR triggers those workflows normally.
#
# The concurrency group is keyed on the workflow only (not the tag), so
# releases published close together are serialized rather than racing to
# open two PRs that both edit CHANGELOG.md from the same base. The branch
# name includes run_id so republishing the same tag (e.g. after editing
# release notes) can't collide with a still-open prior PR/branch -- the
# underlying action has no existing-PR check and hard-fails if it does.
name: Changelog

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    # Pre-releases (RCs, betas) aren't final -- don't document them in
    # CHANGELOG.md, which is scoped to real releases.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Update CHANGELOG.md
        uses: BobAnkh/auto-generate-changelog@e8e1af1493032e025901cfdeb9ea6e67e4ffe208 # v1.3.2
        with:
          REPO_NAME: ${{ github.repository }}
          ACCESS_TOKEN: ${{ secrets.CHANGELOG_PAT }}
          PATH: "CHANGELOG.md"
          BRANCH: "changelog/update-${{ github.event.release.tag_name }}-${{ github.run_id }}"
          PULL_REQUEST: "main"
          COMMIT_MESSAGE: "docs(changelog): update release notes"
          TYPE: "feat:Features,fix:Bug Fixes"

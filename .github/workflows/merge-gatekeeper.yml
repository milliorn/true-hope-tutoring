---
name: Merge Gatekeeper

on:
  pull_request:
    branches:
      - main

jobs:
  merge-gatekeeper:
    runs-on: ubuntu-latest
    # This repo also waits on Netlify deploy-preview checks alongside the
    # GitHub Actions ones. The action's own internal poll timeout does not
    # exit gracefully on expiry, doValidateCmd returns ctx.Err() on its
    # context deadline, which fails the step exactly like the job-level
    # timeout would, just sooner. So the only real fix is giving the job
    # itself enough time to wait out the slowest sibling check.
    timeout-minutes: 5
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Run Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

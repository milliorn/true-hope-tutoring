# Creates the v<version> git tag after a release.yml PR actually merges into
# main, rather than tagging when the PR is opened. main's ruleset allows
# squash merges, which rewrite the commit, so a tag created before merge would
# point at a commit no longer reachable from main's history.
#
# Checks out pull_request.merge_commit_sha, the exact commit GitHub created
# for this PR's merge, rather than ref: main. main's tip can move between
# this PR merging and this job running (another PR merging first, for
# example), so checking out main itself risks tagging an unrelated later
# commit instead of this release's actual merge commit.
name: Tag release

on:
  pull_request:
    types: [closed]
    branches: ["main"]

permissions:
  contents: write

jobs:
  # Repo-level delete_branch_on_merge only cleans up a chore/release-v*
  # branch when its PR merges. If one is closed WITHOUT merging instead (a
  # release PR superseded by a later, bigger one, or closed manually), the
  # branch is left behind on origin. release.yml's duplicate-release guard
  # only checks for an open PR on that branch name, not the branch's mere
  # existence, so a later run computing the same version would silently
  # force-push over the abandoned branch's content. Deleting it here on the
  # closed-without-merge path keeps that from being able to happen.
  cleanup-abandoned-release-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ github.event.pull_request.merged == false && startsWith(github.event.pull_request.head.ref, 'chore/release-v') }}
    steps:
      - name: Delete abandoned release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tolerate the ref already being gone (422): delete_branch_on_merge,
          # a maintainer manually deleting it from the closed-PR page before
          # this job runs, or a redelivered `closed` webhook can all get here
          # first. The desired end state (branch gone) already holds in that
          # case, so this job should not fail for having nothing left to do.
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }}" || \
            echo "Branch already gone, nothing to clean up."

  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'chore/release-v') }}
    # Keyed per release branch (chore/release-vX.Y.Z), not the whole
    # workflow: two closed+merged events resolving close together for the
    # SAME release PR (a redelivered webhook, or a manual re-run) would
    # otherwise race past the git ls-remote idempotency check below before
    # either push lands. Two DIFFERENT release PRs tagging different
    # versions don't conflict, so they shouldn't have to queue behind each
    # other.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Create and push tag
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"

          # Idempotency guard: a manual re-run of this job (e.g. after an
          # unrelated transient failure) or a duplicate webhook delivery of
          # the same closed+merged event would otherwise fail on the second
          # attempt, since both git tag and git push reject a tag that
          # already exists.
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "$tag already exists on origin, skipping."
            exit 0
          fi

          git tag "$tag"
          git push origin "$tag"

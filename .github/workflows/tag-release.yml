# Creates the v<version> git tag after a release.yml PR actually merges into
# main, rather than tagging when the PR is opened. main's ruleset allows
# squash merges, which rewrite the commit, so a tag created before merge would
# point at a commit no longer reachable from main's history.
#
# Checks out pull_request.merge_commit_sha, the exact commit GitHub created
# for this PR's merge, rather than ref: main. main's tip can move between
# this PR merging and this job running (another PR merging first, for
# example), so checking out main itself risks tagging an unrelated later
# commit instead of this release's actual merge commit.
name: Tag release

on:
  pull_request:
    types: [closed]
    branches: ["main"]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'chore/release-v') }}
    # Keyed per release branch (chore/release-vX.Y.Z), not the whole
    # workflow: two closed+merged events resolving close together for the
    # SAME release PR (a redelivered webhook, or a manual re-run) would
    # otherwise race past the git ls-remote idempotency check below before
    # either push lands. Two DIFFERENT release PRs tagging different
    # versions don't conflict, so they shouldn't have to queue behind each
    # other.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Create and push tag
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"

          # Idempotency guard: a manual re-run of this job (e.g. after an
          # unrelated transient failure) or a duplicate webhook delivery of
          # the same closed+merged event would otherwise fail on the second
          # attempt, since both git tag and git push reject a tag that
          # already exists.
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "$tag already exists on origin, skipping."
            exit 0
          fi

          git tag "$tag"
          git push origin "$tag"

# Runs commit-and-tag-version on every push to main and opens a PR with the
# version bump + CHANGELOG.md update, so those stay current without a manual
# `npm run release` step.
#
# This opens a PR rather than pushing straight to main because it keeps the
# release change reviewable and gated through the same checks every other PR
# gets (merge-gatekeeper, CI, dependency review), even though a direct push
# by this PAT would not actually be rejected by the ruleset: the PAT acts as
# its owning user, who holds the Admin repository role, and the ruleset's
# bypass_actors entry (RepositoryRole, bypass_mode: always) covers that role.
# GITHUB_TOKEN, by contrast, has no repository role and genuinely cannot
# bypass the ruleset.
#
# DEPENDABOT_REBASE_PAT (not GITHUB_TOKEN) authenticates the PR-open step.
# A GITHUB_TOKEN-authored pull_request event does not trigger other
# pull_request-scoped workflows (GitHub's anti-recursion protection), which
# would silently strand this PR forever: ci.yml, dependency-review.yml, and
# merge-gatekeeper.yml all trigger on pull_request, and merge-gatekeeper is
# this repo's one required status check, so a GITHUB_TOKEN-opened PR could
# never pass review-gating. A PAT-authored PR is a normal event and triggers
# those workflows correctly, the same reason automerge.yml uses this PAT for
# its own gh pr merge call.
#
# This workflow's own push to main (the squash-merged release PR landing)
# is what must not loop back into this job, not the PR-open event, so the
# loop guard below is what prevents that, not the choice of token.
name: Release

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # token: the PAT, not the implicit GITHUB_TOKEN actions/checkout would
      # otherwise persist. The later `git push origin "$branch"` (a bare git
      # command, not a gh CLI call) authenticates off whatever credential
      # checkout persisted here, not off the GH_TOKEN env var set further
      # down, GH_TOKEN only affects gh CLI calls. Without this, that push
      # would silently go out as github-actions[bot] despite every comment
      # in this file explaining why it needs to be the PAT.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPENDABOT_REBASE_PAT }}

      # Skip the release PR's own squash-merge commit so this job never
      # chases its own output. Looks up the real PR(s) associated with this
      # push's commit via the commits/{sha}/pulls API and checks their
      # actual head ref, rather than string-matching head_commit.message
      # for "chore(release):". The commit message is free text a maintainer
      # can edit in GitHub's merge UI before confirming a squash merge, so
      # matching it is defeatable; the PR's head ref is not editable the
      # same way and is the same reliable signal tag-release.yml already
      # uses for this same purpose.
      - name: Check whether this push is a release PR landing
        id: guard
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_PAT }}
          # Passed as an env var, not interpolated directly into the script,
          # because head_commit.message is attacker-influenceable (anyone
          # who can push/merge a commit controls this string) and inlining
          # it into the `run:` template before bash sees it would be a
          # shell-injection hole.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # The commit-to-PR association API is a secondary index and can
          # lag briefly right after a squash-merge lands -- i.e. exactly when
          # this job fires. An empty/failed lookup here must not be treated
          # the same as "confirmed not a release landing", so fall back to
          # the commit message (defeatable by a maintainer hand-editing the
          # squash message, but only in the fail-safe direction: it can only
          # cause a false "is_release_landing=true", never a false "false").
          head_refs=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[].head.ref' || true)
          if echo "$head_refs" | grep -q "^chore/release-v" || \
             [[ "$HEAD_COMMIT_MESSAGE" == chore\(release\):* ]]; then
            echo "is_release_landing=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_landing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.guard.outputs.is_release_landing == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        if: steps.guard.outputs.is_release_landing == 'false'
        run: npm ci

      - name: Configure git identity
        if: steps.guard.outputs.is_release_landing == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --noBumpWhenEmptyChanges (camelCase, verified against the installed
      # package's yargs option definitions and empirically tested in a
      # scratch repo) makes the tool skip the version bump and changelog
      # write entirely when there are no feat/fix commits since the last tag
      # -- its default behavior otherwise bumps a patch regardless. The
      # kebab-case form --no-bump-when-empty-changes looks right but silently
      # does nothing: yargs treats a leading "no-" as negating the remaining
      # flag name, and this flag's name already starts with "no", so it
      # collides with yargs' own negation handling instead of setting the
      # option. When skipped, the tool prints an internal, unversioned log
      # message rather than a stable machine-readable signal, so skip
      # detection below compares package.json's version before/after instead
      # of matching that string.
      #
      # --skip.tag skips creating the local git tag entirely. commit-and-tag-
      # version's default behavior tags immediately, but that tag would point
      # at a commit that's not on main yet (this is still a local branch at
      # this point), and main's ruleset allows squash merges, which rewrite
      # the commit on merge, making a tag created now unreachable from main's
      # history once merged. tag-release.yml creates the real tag after this
      # PR actually merges, against whatever commit squashing/rebasing
      # produced on main.
      - name: Run release
        id: release
        if: steps.guard.outputs.is_release_landing == 'false'
        run: |
          set -euo pipefail
          before=$(node -p "require('./package.json').version")
          npm run release -- --noBumpWhenEmptyChanges --skip.tag
          after=$(node -p "require('./package.json').version")
          if [ "$before" = "$after" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open release PR
        if: steps.guard.outputs.is_release_landing == 'false' && steps.release.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_PAT }}
        run: |
          version=$(node -p "require('./package.json').version")
          branch="chore/release-v${version}"

          # Guard against opening a second release PR while an earlier one
          # is still open. This checks any chore/release-v* branch, not just
          # one matching this run's computed version: an unmerged release PR
          # means its version bump isn't tagged yet, so a later run recomputes
          # a different (higher) next version from the same unreleased
          # commits plus whatever landed since, and would otherwise open a
          # second PR with overlapping/conflicting CHANGELOG and version
          # content instead of being caught by an exact-branch-name match.
          # --limit 100: gh pr list defaults to 30. With 30+ open PRs (a
          # Dependabot batch, or a stalled automerge backlog) a genuinely
          # open release PR could sit outside a default-sized page, this
          # count would read 0, and a second conflicting release PR would
          # be opened despite the guard below.
          open_release_prs=$(gh pr list --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("chore/release-v"))] | length')
          if [ "$open_release_prs" -gt 0 ]; then
            echo "A release PR is already open, skipping."
            exit 0
          fi

          # Warn (rather than silently overwrite) if this branch already
          # exists on origin with no open PR -- i.e. an abandoned release
          # branch that tag-release.yml's cleanup job hasn't (yet) removed.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::warning::$branch already exists on origin with no open PR; force-pushing over it."
          fi

          git checkout -b "$branch"
          git push origin "$branch" --force
          gh pr create \
            --title "chore(release): ${version}" \
            --body "Automated release PR generated by commit-and-tag-version. Merge to publish CHANGELOG.md and the version bump to main. The v${version} tag is created separately after this merges." \
            --base main \
            --head "$branch"

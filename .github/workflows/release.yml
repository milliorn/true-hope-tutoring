# Runs commit-and-tag-version on every push to main and opens a PR with the
# version bump + CHANGELOG.md update, so those stay current without a manual
# `npm run release` step.
#
# This opens a PR rather than pushing straight to main because the repo's
# "main" ruleset requires every change to land through a pull request
# (squash or rebase merge only, non_fast_forward, required_linear_history) --
# a direct push would be rejected, and GITHUB_TOKEN's bot identity is not
# covered by the ruleset's admin-role bypass actor.
#
# GITHUB_TOKEN (not DEPENDABOT_REBASE_PAT) authenticates the push to the
# release branch on purpose: a GITHUB_TOKEN-authored push does not retrigger
# other workflow runs (GitHub's anti-recursion protection), so opening this
# PR can't cause an infinite loop back into this same workflow the way a
# PAT-authenticated push would. Merging the resulting PR later is a normal,
# human-authored merge event, so it triggers the usual checks as expected.
name: Release

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Skip anything already on a release branch/commit so this job never
    # chases its own output.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --noBumpWhenEmptyChanges (camelCase, verified against the installed
      # package's yargs option definitions and empirically tested in a
      # scratch repo) makes the tool skip the version bump and changelog
      # write entirely when there are no feat/fix commits since the last tag
      # -- its default behavior otherwise bumps a patch regardless. The
      # kebab-case form --no-bump-when-empty-changes looks right but silently
      # does nothing: yargs treats a leading "no-" as negating the remaining
      # flag name, and this flag's name already starts with "no", so it
      # collides with yargs' own negation handling instead of setting the
      # option. When skipped, the tool prints the exact string below and
      # exits 0 without touching package.json or CHANGELOG.md.
      - name: Run release
        id: release
        run: |
          output=$(npm run release -- --noBumpWhenEmptyChanges 2>&1)
          echo "$output"
          if echo "$output" | grep -q "no commits found, so not bumping version"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # No tag push here on purpose. This PR's commit isn't on main yet, and
      # main's ruleset allows squash merges, which would leave a tag pointing
      # at a commit that's unreachable from main's history once merged.
      # tag-release.yml creates the real tag after this PR actually merges,
      # against whatever commit squashing/rebasing produced on main.
      - name: Open release PR
        if: steps.release.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          branch="chore/release-v${version}"
          git tag -d "v${version}"
          git checkout -b "$branch"
          git push origin "$branch" --force
          gh pr create \
            --title "chore(release): ${version}" \
            --body "Automated release PR generated by commit-and-tag-version. Merge to publish CHANGELOG.md and the version bump to main. The v${version} tag is created separately after this merges." \
            --base main \
            --head "$branch"
